name: Build and Push Docker Images

on:
  push:
    branches: [master]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build & Push Web App
      run: |
        docker build -t webapp .
        docker tag webapp:latest 302497958420.dkr.ecr.us-east-1.amazonaws.com/webapp:latest
        docker push 302497958420.dkr.ecr.us-east-1.amazonaws.com/webapp:latest

    - name: Build & Push MySQL
      run: |
        docker build -t mysql ./mysql
        docker tag mysql:latest 302497958420.dkr.ecr.us-east-1.amazonaws.com/mysql:latest
        docker push 302497958420.dkr.ecr.us-east-1.amazonaws.com/mysql:latest

