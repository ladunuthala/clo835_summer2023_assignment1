name: Build and Push

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - uses: aws-actions/amazon-ecr-login@v1

    - run: |
        docker build -t webapp .
        docker tag webapp:latest $AWS_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/clo835-webapp:latest
        docker push $AWS_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/clo835-webapp:latest

    - run: |
        docker build -t mysql ./mysql
        docker tag mysql:latest $AWS_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/clo835-mysql:latest
        docker push $AWS_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/clo835-mysql:latest

